
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CampusFind</title>
  <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/genz-theme.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">CampusFind</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="register.html">Register</a>
    </nav>
  </header>

  <main class="auth-container">
    <section class="auth-card">
      <h1>Hey, you're back! 👋</h1>
      <p>Sign in and get back to your campus community.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary">Login</button>

        <p id="loginMessage" class="form-message"></p>
      </form>

      <p class="auth-switch">
        Don't have an account?
        <a href="register.html">Create one</a>
      </p>
    </section>
  </main>

  <script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
