
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | CampusFind</title>
  <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/genz-theme.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">CampusFind</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main class="auth-container">
    <section class="auth-card">
      <h1>Join the community ✨</h1>
      <p>Make an account to report, find and reunite campus belongings.</p>

      <form id="registerForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password (minimum 8 characters)"
            minlength="8"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary">
          Join the community ✨
        </button>

        <p id="registerMessage" class="form-message"></p>
      </form>

      <p class="auth-switch">
        Already have an account?
        <a href="login.html">Login</a>
      </p>
    </section>
  </main>

  <script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
